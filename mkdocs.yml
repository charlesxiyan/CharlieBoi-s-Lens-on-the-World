site_name: "CharlieBoi's Lens on the World"
site_description: LeetCode explanations, quantitative finance interview notes, and life through Charles's lens.
site_author: Charles
site_url: !ENV [SITE_URL, "https://charlieboi.com/"]
repo_url: https://github.com/charlesxiyan/CharlieBoi-s-Lens-on-the-World
repo_name: charlesxiyan/CharlieBoi-s-Lens-on-the-World
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/camera-iris
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

